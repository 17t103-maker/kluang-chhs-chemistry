    <script>
        const examDatabase = {
            A: {
                title: "甲) 选择题 (33%，每题 1.5%)",
                questions: [
                    {
                        id: 1,
                        text: "下列叙述中正确的是______。",
                        options: [
                            "A. 含最高价元素的化合物，一定具有强氧化性。",
                            "B. 阳离子只有氧化性，阴离子只有还原性",
                            "C. 失电子越多，还原性越强。",
                            "D. 金属阳离子还原后不一定会得到单质。"
                        ],
                        correct: "D",
                        sol: "<strong>【答案解析 D】</strong><br>• <strong>A 错误</strong>：含最高价元素的化合物不一定氧化性强（如 H₃PO₄ 中 P 为 +5 最高价，但氧化性极弱）。<br>• <strong>B 错误</strong>：处于中间价态的阳离子（如 Fe²⁺）既有氧化性又有还原性；阴离子（如 SO₃²⁻）亦具有还原性与氧化性。<br>• <strong>C 错误</strong>：还原性强弱取决于原子或离子的<strong>失电子难易程度</strong>，与失电子数量无关。<br>• <strong>D 正确</strong>：高价金属阳离子被还原可以生成低价阳离子（如 Fe³⁺ 得到 1e⁻ 还原为 Fe²⁺），不一定直接得到单质。"
                    },
                    {
                        id: 2,
                        text: "下列叙述，正确的是______。",
                        options: [
                            "A. 电解饱和食盐水时氯化钠的氧化性大于氢氧化钠。",
                            "B. 氢化锂与水反应，氢化锂被氧化。",
                            "C. 氧化铁在高炉炼铁中制得生铁，CO 被还原。",
                            "D. 碳酸钙加热反应是氧化还原反应。"
                        ],
                        correct: "B",
                        sol: "<strong>【答案解析 B】</strong><br>• <strong>A 错误</strong>：电解食盐水是阳离子 H⁺ 和阴离子 Cl⁻ 在电极放电，与 NaCl、NaOH 氧化性比较无关。<br>• <strong>B 正确</strong>：在 LiH 中 H 为 -1 价，与 H₂O 反应方程式为：LiH + H₂O → LiOH + H₂↑。LiH 中的 H（-1价）失去电子升高到 0 价生成 H₂，被氧化。<br>• <strong>C 错误</strong>：CO 夺取氧生成 CO₂，C 元素化合价升高，CO 被氧化为还原剂。<br>• <strong>D 错误</strong>：CaCO₃ —(高温)→ CaO + CO₂↑，反应前后各元素化合价均未改变，为非氧化还原反应。"
                    },
                    {
                        id: 3,
                        text: "x R²⁺ + y H⁺ + O₂ → m R³⁺ + n H₂O 的离子方程式中，正确的是______。",
                        options: [
                            "A. m = 2, R³⁺ 是氧化产物",
                            "B. m = y, H⁺ 没有进行氧化还原",
                            "C. m = 4, R³⁺ 是还原产物",
                            "D. n = 2y, H₂O 是还原产物"
                        ],
                        correct: "B",
                        sol: `<strong>【答案解析 B】</strong><br>
                        <strong>1. 离子方程式守恒配平：</strong><br>
                        • 电子转移：R²⁺ ➔ R³⁺（失 1e⁻，发生氧化反应，R³⁺ 为氧化产物）；O₂ ➔ 2O²⁻（得 4e⁻，发生还原反应，H₂O 为还原产物）。<br>
                        • 得失电子与电荷/质量守恒配平：<strong>4R²⁺ + 4H⁺ + O₂ = 4R³⁺ + 2H₂O</strong><br>
                        • 对应系数为：x = 4, y = 4, m = 4, n = 2。<br>
                        <strong>2. 选项逐项剖析：</strong><br>
                        • <strong>A 错误</strong>：m = 4 而非 2。<br>
                        • <strong>B 正确</strong>：m = 4, y = 4，故 <strong>m = y 成立</strong>；H⁺ 中氢元素反应前后化合价均为 +1，未发生氧化还原反应。<br>
                        • <strong>C 错误</strong>：R³⁺ 是失电子氧化后的<strong>氧化产物</strong>。<br>
                        • <strong>D 错误</strong>：y = 4, n = 2，比例关系为 y = 2n（即 n = ½y），选项中 n = 2y 颠倒了比例。`
                    },
                    {
                        id: 4,
                        text: "检验苛性钠溶液中含有少量纯碱的方法是______。",
                        options: [
                            "A. 加入少量盐酸有气泡产生",
                            "B. 加入少量 CO₂ 气体有浑浊现象",
                            "C. 加热产生气泡",
                            "D. 加入 KCl 溶液有白色沉淀产生"
                        ],
                        correct: "A",
                        sol: "<strong>【答案解析 A】</strong><br>苛性钠（NaOH）中含少量纯碱（Na₂CO₃）。加入足量稀盐酸，Na₂CO₃ 与盐酸反应释放出 CO₂ 气体（Na₂CO₃ + 2HCl → 2NaCl + H₂O + CO₂↑），产生明显气泡。"
                    },

        }

        function selectQuestion(idx) {
            currentQuestionIdx = idx;
            isAnswerShown = false;
            renderNumberTabs();
            renderSingleQuestion();
        }

        function renderSingleQuestion() {
            const secData = examDatabase[currentSectionKey];
            const q = secData.questions[currentQuestionIdx];
            const container = document.getElementById('display-area');

            let optionsHtml = '';
            if (q.options) {
                optionsHtml = '<div class="q-options">';
                q.options.forEach(opt => {
                    optionsHtml += `<div class="q-opt-item" onclick="toggleAnswer()">${opt}</div>`;
                });
                optionsHtml += '</div>';
            }

            let imgHtml = '';
            if (q.hasImage) {
                imgHtml = `
                    <div class="image-container">
                        <img src="${q.imagePath}" alt="题目图示" class="quiz-image" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <div class="image-placeholder-box">
                            📌 <strong>图片预留位置</strong>：<code>${q.imagePath}</code><br>
                            <span style="font-size:0.85em; color:var(--text-sub);">${q.imageDesc || ''}</span>
                        </div>
                    </div>
                `;
            }

            let extraHtml = '';
            if (q.tableData) extraHtml += q.tableData;
            if (q.content) extraHtml += `<div style="margin:12px 0;">${q.content}</div>`;
            if (q.subQuestions) extraHtml += `<div style="margin:12px 0;">${q.subQuestions}</div>`;

            container.innerHTML = `
                <span class="q-header-badge">${secData.title} · 第 ${q.id} 题</span>
                <div class="q-title">${q.text}</div>
                ${imgHtml}
                ${optionsHtml}
                ${extraHtml}

                <div class="action-bar">
                    <button class="btn-action" onclick="toggleAnswer()">
                        ${isAnswerShown ? '🙈 隐藏参考答案与解析' : '💡 显示参考答案与详细解析'}
                    </button>
                    <div style="display:flex; gap:8px;">
                        <button class="btn-tool" onclick="prevQuestion()" ${currentQuestionIdx === 0 ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}>⬅️ 上一题</button>
                        <button class="btn-tool" onclick="nextQuestion()" ${currentQuestionIdx === secData.questions.length - 1 ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}>下一题 ➡️</button>
                    </div>
                </div>

                <div class="answer-panel ${isAnswerShown ? 'show' : ''}" id="ans-panel">
                    <div class="ans-header">✅ 官方参考答案与名师精析</div>
                    <div class="ans-content">${q.sol}</div>
                </div>
            `;
        }

        function toggleAnswer() {
            isAnswerShown = !isAnswerShown;
            const panel = document.getElementById('ans-panel');
            if (panel) {
                if (isAnswerShown) {
                    panel.classList.add('show');
                } else {
                    panel.classList.remove('show');
                }
            }
            const btn = document.querySelector('.btn-action');
            if (btn) {
                btn.innerHTML = isAnswerShown ? '🙈 隐藏参考答案与解析' : '💡 显示参考答案与详细解析';
            }
        }

        function prevQuestion() {
            if (currentQuestionIdx > 0) {
                currentQuestionIdx--;
                isAnswerShown = false;
                renderNumberTabs();
                renderSingleQuestion();
            }
        }

        function nextQuestion() {
            const secData = examDatabase[currentSectionKey];
            if (currentQuestionIdx < secData.questions.length - 1) {
                currentQuestionIdx++;
                isAnswerShown = false;
                renderNumberTabs();
                renderSingleQuestion();
            }
        }

        function renderFullExam(showAnswers) {
            document.getElementById('btn-mode-single').classList.remove('active');
            document.getElementById('btn-mode-print').classList.toggle('active', !showAnswers);
            document.getElementById('btn-mode-answers').classList.toggle('active', showAnswers);

            const container = document.getElementById('display-area');
            let fullHtml = `
                <div style="text-align:center; margin-bottom:24px; padding-bottom:16px; border-bottom:2px solid var(--border-color);">
                    <h2>居銮中华中学 2025 年下半年统一测验 高一理科化学试卷</h2>
                    <p style="color:var(--text-sub);">考试时间：80 分钟 &nbsp;&nbsp;|&nbsp;&nbsp; 满分：100% ${showAnswers ? ' (全卷答案解析版)' : ' (学生测验版)'}</p>
                </div>
            `;

            ['A', 'B', 'C', 'D', 'E'].forEach(secKey => {
                const sec = examDatabase[secKey];
                fullHtml += `
                    <div class="full-exam-section">
                        <h3 style="color:var(--primary); margin-bottom:14px; font-size:1.2rem;">${sec.title}</h3>
                `;

                sec.questions.forEach(q => {
                    let opts = '';
                    if (q.options) {
                        opts = `<div style="margin:8px 0 10px 14px;">${q.options.map(o => `<div>${o}</div>`).join('')}</div>`;
                    }

                    let img = '';
                    if (q.hasImage) {
                        img = `
                            <div class="image-container">
                                <img src="${q.imagePath}" alt="题目图示" class="quiz-image" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                                <div class="image-placeholder-box">
                                    📌 <strong>图片预留位置</strong>：<code>${q.imagePath}</code>
                                </div>
                            </div>
                        `;
                    }

                    let extra = '';
                    if (q.tableData) extra += q.tableData;
                    if (q.content) extra += `<div style="margin:8px 0;">${q.content}</div>`;
                    if (q.subQuestions) extra += `<div style="margin:8px 0;">${q.subQuestions}</div>`;

                    let ans = '';
                    if (showAnswers) {
                        ans = `
                            <div style="margin-top:10px; padding:10px 14px; background:var(--ans-box-bg); border-left:3px solid var(--accent-green); border-radius:4px; font-size:0.9rem;">
                                ${q.sol}
                            </div>
                        `;
                    }

                    fullHtml += `
                        <div class="full-q-item">
                            <div><strong>第 ${q.id} 题.</strong> ${q.text}</div>
                            ${img}
                            ${opts}
                            ${extra}
                            ${ans}
                        </div>
                    `;
                });

                fullHtml += `</div>`;
            });

            container.innerHTML = fullHtml;
        }

        function returnSingleMode() {
            document.getElementById('btn-mode-single').classList.add('active');
            document.getElementById('btn-mode-print').classList.remove('active');
            document.getElementById('btn-mode-answers').classList.remove('active');
            renderSingleQuestion();
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }

        /* 手机端控制台折叠展开逻辑 */
        function toggleControlPanel() {
            const box = document.getElementById('control-collapse-box');
            const btnText = document.getElementById('toggle-btn-text');
            box.classList.toggle('expanded');
            if (box.classList.contains('expanded')) {
                btnText.innerText = "点击收起控制面板";
            } else {
                btnText.innerText = "展开题型与题号控制面板 (手机防遮挡阅读)";
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            switchSection('A');
        });
    </script>
</body>
</html>
