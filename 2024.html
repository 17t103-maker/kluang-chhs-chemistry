        .btn-action {

        /* 表格排版 */

            font-weight: 700;

        /* 全卷清览模式 */
        .full-exam-section {

            padding-bottom: 20px;
            border-bottom: 2px dashed var(--border-color);

        .full-q-item {
            margin-bottom: 24px;
            padding: 16px;
            background: var(--bg-card-sub);

        @media print {

</head>

    <script>
        const examDatabase = {
            A: {
                title: "甲) 选择题 (40%，每题 2%)",
                questions: [
                    {
                        id: 1,
                        text: "下列叙述错误的是：",
                        options: [
                            "A. 单质晶体中不可能含有离子键。",
                            "B. 金属单质在氧化还原反应中一定作为还原剂。",
                            "C. 含离子键的化合物一定是离子化合物。",
                            "D. 某元素从化合态变为单质，该元素一定是被还原。"
                        ],
                        correct: "D",
                        sol: "<strong>【答案解析 D】</strong><br>• <strong>A 正确</strong>：单质由同种元素组成，无阴阳离子，不可能存在离子键。<br>• <strong>B 正确</strong>：金属单质处于 0 价，化合价只能升高（失电子），故在反应中必定作还原剂。<br>• <strong>C 正确</strong>：含离子键的化合物即为离子化合物。<br>• <strong>D 错误</strong>：元素由化合态变为单质，化合价可以升高（如 2Cl⁻ → Cl₂ 失电子被氧化），也可以降低。"
                    },
                    {
                        id: 2,
                        text: "下列变化中，叙述正确的是：",
                        options: [
                            "A. 电解水使其分解，破坏了氢键。",
                            "B. 加热硅单质使其熔化，破坏了金属键。",
                            "C. 氯化钠溶于水，离子键被破坏。",
                            "D. 干冰升华时，共价键被破坏。"
                        ],
                        correct: "C",
                        sol: "<strong>【答案解析 C】</strong><br>• <strong>A 错误</strong>：电解水破坏的是水分子内的 H-O 极性共价键。<br>• <strong>B 错误</strong>：硅属于原子晶体，熔化破坏共价键。<br>• <strong>C 正确</strong>：NaCl 溶于水发生电离，破坏了 Na⁺ 与 Cl⁻ 间的离子键。<br>• <strong>D 错误</strong>：干冰升华是物理变化，破坏的是分子间范德华力。"
                    },
                    {
                        id: 3,
                        text: "下列各组物质的晶体中，晶体类型相同的是：",
                        options: [
                            "A. Na₂O₂ 与 H₂O₂",
                            "B. 氮化硼 与 碳化硅",
                            "C. 金刚石 与 钢铁",
                            "D. 钾 与 氧化钾"
                        ],
                        correct: "B",
                        sol: "<strong>【答案解析 B】</strong><br>氮化硼（BN）和碳化硅（SiC）均属于<strong>原子晶体（共价晶体）</strong>，晶体类型相同。"
                    },
                    {
                        id: 4,
                        text: "将下列共价键按极性强至弱排列：① H-O &nbsp;&nbsp; ② N-H &nbsp;&nbsp; ③ H-Br &nbsp;&nbsp; ④ H-F",
                        options: [
                            "A. ① ② ③ ④",
                            "B. ④ ① ② ③",
                            "C. ③ ② ① ④",
                            "D. ④ ① ③ ②"
                        ],
                        correct: "B",
                        sol: "<strong>【答案解析 B】</strong><br>电负性差越大极性越强：<strong>H-F (④) > H-O (①) > N-H (②) > H-Br (③)</strong>。"
                    },
                    {
                        id: 5,
                        text: "下列哪个分子的键结电子数是正确的？",
                        options: [
                            "A. CO₂ : 4",
                            "B. H₂O : 2",
                            "C. N₂ : 6",
                            "D. CCl₄ : 4"
                        ],
                        correct: "C",
                        sol: "<strong>【答案解析 C】</strong><br>N₂ 分子含 1 个 N≡N 叁键，共有 3 对共用电子对 = <strong>6 个键结电子</strong>。"
                    },
                    {
                        id: 6,
                        text: "下列有关氢键的叙述错误的是：",
                        options: [
                            "A. 它是一种较强的分子间作用力。",
                            "B. 它会影响物质的溶解性、熔点和沸点。",
                            "C. 水的反常膨胀与氢键有关。",
                            "D. 含氢元素的化合物之间都能形成氢键。"
                        ],
                        correct: "D",
                        sol: "<strong>【答案解析 D】</strong><br>氢键只存在于 H 与电负性极大、半径小的 F、O、N 原子相连的分子间或分子内，并非所有含氢化合物间都能形成氢键。"
                    },
                    {
                        id: 7,
                        text: "下列有关铵根（NH₄⁺）的叙述错误的是：",
                        options: [
                            "A. 4 个 N-H 键都属于极性共价键。",
                            "B. 4 个 N-H 键中有一个配位键，3 个共价键。",
                            "C. 铵根离子中氮的氧化数是 -3。",
                            "D. 4 个 N-H 键中的配位键键长较短，键能较大。"
                        ],
                        correct: "D",
                        sol: "<strong>【答案解析 D】</strong><br>配位键形成后，铵根中的 4 个 N-H 键经杂化完全等价，键长和键能完全相同，无区别。"
                    },
                    {
                        id: 8,
                        text: "下列哪种物质一定不能导电？",
                        options: [
                            "A. 固态金属晶体",
                            "B. 固态离子晶体",
                            "C. 离子晶体的水溶液",
                            "D. 分子晶体的水溶液"
                        ],
                        correct: "B",
                        sol: "<strong>【答案解析 B】</strong><br>固态离子晶体中的离子被固定在晶格结点上无法自由移动，因此固态离子晶体一定不能导电。"
                    },
                    {
                        id: 9,
                        text: "如右图所示表示周期表 IVA 到 VIIA 族元素氢化物沸点的变化，其中 a 点代表的是：",
                        hasImage: true,
                        imagePath: "image/2024/Screenshot 2026-08-15 195800.jpg",
                        imageDesc: "【第9题氢化物沸点随周期变化曲线图】",
                        options: [
                            "A. SiH₄",
                            "B. PH₃",
                            "C. H₂S",
                            "D. HCl"

                            &nbsp;&nbsp;&nbsp;&nbsp;(i) 氧化钠、氯化镁、氯化铝<br>
                            &nbsp;&nbsp;&nbsp;&nbsp;(ii) HF、HCl、HBr、HI</p>
                            <p><strong>(b)</strong> 写出 NH₃ 的电子式，并写出氨分子中各元素的氧化数。 (2%)</p>
                        `,
                        sol: `<strong>【标准参考答案】</strong><br>
                        • <strong>(a)(i) 熔点顺序</strong>：<strong>Na₂O &gt; MgCl₂ &gt; AlCl₃</strong><br>
                        &nbsp;&nbsp;<strong>原因</strong>：AlCl₃ 为分子晶体，微弱范德华力，熔点最低；Na₂O 与 MgCl₂ 为离子晶体，O²⁻ 半径小于 Cl⁻且带电多，晶格能更大，故 Na₂O 熔点最高。<br><br>
                        • <strong>(a)(ii) 沸点顺序</strong>：<strong>HF &gt; HI &gt; HBr &gt; HCl</strong><br>
                        &nbsp;&nbsp;<strong>原因</strong>：HF 存在分子间氢键，沸点最高；其余随相对分子质量增大范德华力增强，沸点 HI > HBr > HCl。<br><br>
                        • <strong>(b) 氨分子结构与氧化数</strong>：<br>
                        &nbsp;&nbsp;电子式：<strong>H:N̈:H (上方及下方连 H)</strong><br>
                        &nbsp;&nbsp;氧化数：<strong>N: -3 &nbsp;,&nbsp; H: +1</strong>`
                    },
                    {
                        id: 3,
                        text: "第 3 题：IVA 氧化物状态、钠转化链与氮气稳定性 (8%)",
                        content: `
                            <p><strong>(a)</strong> CO₂ 与 SiO₂ 都是 IVA 元素的氧化物，为何常温下 CO₂ 是气体，而 SiO₂ 是固体？ (3%)</p>
                            <p><strong>(b)</strong> 用化学方程式表示物质转化（注明反应条件）：NaCl ➔ Na ➔ NaH ➔ NaOH (3%)</p>
                            <p><strong>(c)</strong> 试解释为何氮气的沸点低，但氮气又非常稳定。 (2%)</p>
                        `,
                        sol: `<strong>【标准参考答案】</strong><br>
                        • <strong>(a) 晶体类型差异</strong>：<br>
                        &nbsp;&nbsp;CO₂ 属于<strong>分子晶体</strong>，分子间范德华力弱；SiO₂ 属于<strong>原子晶体</strong>，原子间共价键极强，故熔沸点极高呈固体。<br><br>
                        • <strong>(b) 转化反应式（标注状态与条件）</strong>：<br>
                        &nbsp;&nbsp;① <strong>2NaCl(l) <span style="font-size:0.85em;">—(通电熔融)→</span> 2Na(l) + Cl₂(g)↑</strong><br>
                        &nbsp;&nbsp;② <strong>2Na(s) + H₂(g) <span style="font-size:0.85em;">—(高温)→</span> 2NaH(s)</strong><br>
                        &nbsp;&nbsp;③ <strong>NaH(s) + H₂O(l) → NaOH(aq) + H₂(g)↑</strong><br><br>
                        • <strong>(c) 氮气性质解析</strong>：<br>
                        &nbsp;&nbsp;分子晶体范德华力弱故沸点低；分子内存在极强的氮氮叁键（N≡N）键能极大故化学性质极其稳定。`
                    },
                    {
                        id: 4,
                        text: "第 4 题：氨气液化、卤素置换与三种白色粉末鉴别 (8%)",
                        content: `
                            <p><strong>(a)</strong> 氨气为什么比其他气体易液化？ (2%)</p>
                            <p><strong>(b)</strong> 三种单质 A₂、B₂、C₂ 与离子发生反应：<br>
                            &nbsp;&nbsp;&nbsp;&nbsp;2A⁻(aq) + C₂(g) → 2C⁻(aq) + A₂(g)<br>
                            &nbsp;&nbsp;&nbsp;&nbsp;2C⁻(aq) + B₂(g) → 2B⁻(aq) + C₂(g)<br>
                            &nbsp;&nbsp;&nbsp;&nbsp;将 A₂、B₂、C₂ 按氧化性由强至弱排列：__________<br>
                            &nbsp;&nbsp;&nbsp;&nbsp;将 A⁻、B⁻、C⁻ 按还原性由强至弱排列：__________ (2%)</p>
                            <p><strong>(c)</strong> 现有三种白色粉末 NaCl、Na₂CO₃、K₂CO₃，请叙述怎样鉴别它们，并写出相关的化学方程式。 (4%)</p>
                        `,
                        sol: `<strong>【标准参考答案】</strong><br>
                        • <strong>(a) 易液化原因</strong>：氨分子间存在<strong>氢键</strong>，引力大，极易加压液化。<br><br>
                        • <strong>(b) 强弱顺序</strong>：<br>
                        &nbsp;&nbsp;氧化性强至弱：<strong>B₂ &gt; C₂ &gt; A₂</strong><br>
                        &nbsp;&nbsp;还原性强至弱：<strong>A⁻ &gt; C⁻ &gt; B⁻</strong><br><br>
                        • <strong>(c) 鉴别步骤与方程式</strong>：<br>
                        &nbsp;&nbsp;1. <strong>焰色试验</strong>：透过蓝色钴玻璃观察，火焰呈<strong>紫色</strong>的是 <strong>K₂CO₃</strong>；呈<strong>黄色</strong>的是钠盐。<br>
                        &nbsp;&nbsp;2. <strong>加稀盐酸</strong>：在钠盐中滴加稀盐酸，<strong>产生无色气泡</strong>的是 <strong>Na₂CO₃</strong>；<strong>无现象</strong>的是 <strong>NaCl</strong>。<br>
                        &nbsp;&nbsp;• 反应式：<strong>Na₂CO₃(s) + 2HCl(aq) → 2NaCl(aq) + H₂O(l) + CO₂(g)↑</strong>`
                    }
                ]
            },
            G: {
                title: "庚) 加分题 (3%)",
                questions: [
                    {
                        id: 1,
                        text: "1. 写出硝酸钾受热分解的化学方程式。 (1%)",
                        sol: `<strong>【标准反应式】</strong><br>
                        <strong>2KNO₃(s) <span style="font-size:0.85em;">—(加热)→</span> 2KNO₂(s) + O₂(g)↑</strong>`
                    },
                    {
                        id: 2,
                        text: "2. 何谓配位键？ (2%)",
                        sol: `<strong>【标准概念】</strong><br>
                        配位键是一种特殊的共价键。共用的电子对是由成键原子中的<strong>某一个原子单方面提供</strong>，另一成键原子提供<strong>空轨道</strong>结合而成。`
                    }
                ]
            }
        };

        let currentSectionKey = 'A';
        let currentQuestionIdx = 0;
        let isAnswerShown = false;

        function switchSection(secKey) {
            currentSectionKey = secKey;
            currentQuestionIdx = 0;
            isAnswerShown = false;

            const tabs = document.querySelectorAll('.btn-section');
            const secKeys = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
            tabs.forEach((tab, i) => {
                tab.className = secKeys[i] === secKey ? 'btn-section active' : 'btn-section';
            });

            renderNumberTabs();
            renderSingleQuestion();
        }

        function renderNumberTabs() {
            const secData = examDatabase[currentSectionKey];
            const numContainer = document.getElementById('number-tabs');
            let html = '';
            secData.questions.forEach((q, idx) => {
                const activeClass = idx === currentQuestionIdx ? 'active' : '';
                html += `<button class="btn-num ${activeClass}" onclick="selectQuestion(${idx})">第 ${q.id} 题</button>`;
            });
            numContainer.innerHTML = html;
        }

        function selectQuestion(idx) {
            currentQuestionIdx = idx;
            isAnswerShown = false;
            renderNumberTabs();
            renderSingleQuestion();
        }

        function renderSingleQuestion() {
            const secData = examDatabase[currentSectionKey];
            const q = secData.questions[currentQuestionIdx];
            const container = document.getElementById('display-area');

            let optionsHtml = '';
            if (q.options) {
                optionsHtml = '<div class="q-options">';
                q.options.forEach(opt => {
                    optionsHtml += `<div class="q-opt-item" onclick="toggleAnswer()">${opt}</div>`;
                });
                optionsHtml += '</div>';
            }

            let imgHtml = '';
            if (q.hasImage) {
                imgHtml = `
                    <div class="image-container">
                        <img src="${q.imagePath}" alt="题目图示" class="quiz-image" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <div class="image-placeholder-box">
                            📌 <strong>图片预留位置</strong>：<code>${q.imagePath}</code><br>
                            <span style="font-size:0.85em; color:var(--text-sub);">${q.imageDesc || ''}</span>
                        </div>
                    </div>
                `;
            }

            let extraHtml = '';
            if (q.content) extraHtml += `<div style="margin:12px 0;">${q.content}</div>`;

            container.innerHTML = `
                <span class="q-header-badge">${secData.title} · 第 ${q.id} 题</span>
                <div class="q-title">${q.text}</div>
                ${imgHtml}
                ${optionsHtml}
                ${extraHtml}

                <div class="action-bar">
                    <button class="btn-action" onclick="toggleAnswer()">
                        ${isAnswerShown ? '🙈 隐藏参考答案与解析' : '💡 显示参考答案与详细解析'}
                    </button>
                    <div style="display:flex; gap:8px;">
                        <button class="btn-tool" onclick="prevQuestion()" ${currentQuestionIdx === 0 ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}>⬅️ 上一题</button>
                        <button class="btn-tool" onclick="nextQuestion()" ${currentQuestionIdx === secData.questions.length - 1 ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}>下一题 ➡️</button>
                    </div>
                </div>

                <div class="answer-panel ${isAnswerShown ? 'show' : ''}" id="ans-panel">
                    <div class="ans-header">✅ 官方参考答案与名师精析</div>
                    <div class="ans-content">${q.sol}</div>
                </div>
            `;
        }

        function toggleAnswer() {
            isAnswerShown = !isAnswerShown;
            const panel = document.getElementById('ans-panel');
            if (panel) {
                if (isAnswerShown) {
                    panel.classList.add('show');
                } else {
                    panel.classList.remove('show');
                }
            }
            const btn = document.querySelector('.btn-action');
            if (btn) {
                btn.innerHTML = isAnswerShown ? '🙈 隐藏参考答案与解析' : '💡 显示参考答案与详细解析';
            }
        }

        function prevQuestion() {
            if (currentQuestionIdx > 0) {
                currentQuestionIdx--;
                isAnswerShown = false;
                renderNumberTabs();
                renderSingleQuestion();
            }
        }

        function nextQuestion() {
            const secData = examDatabase[currentSectionKey];
            if (currentQuestionIdx < secData.questions.length - 1) {
                currentQuestionIdx++;
                isAnswerShown = false;
                renderNumberTabs();
                renderSingleQuestion();
            }
        }

        function renderFullExam(showAnswers) {
            document.getElementById('btn-mode-single').classList.remove('active');
            document.getElementById('btn-mode-print').classList.toggle('active', !showAnswers);
            document.getElementById('btn-mode-answers').classList.toggle('active', showAnswers);

            const container = document.getElementById('display-area');
            let fullHtml = `
                <div style="text-align:center; margin-bottom:24px; padding-bottom:16px; border-bottom:2px solid var(--border-color);">
                    <h2>居銮中华中学 2024 年下半年统一测验 高一理科化学试卷</h2>
                    <p style="color:var(--text-sub);">考试时间：80 分钟 &nbsp;&nbsp;|&nbsp;&nbsp; 满分：100% ${showAnswers ? ' (全卷答案解析版)' : ' (学生测验版)'}</p>
                </div>
            `;

            ['A', 'B', 'C', 'D', 'E', 'F', 'G'].forEach(secKey => {
                const sec = examDatabase[secKey];
                fullHtml += `
                    <div class="full-exam-section">
                        <h3 style="color:var(--primary); margin-bottom:14px; font-size:1.2rem;">${sec.title}</h3>
                `;

                sec.questions.forEach(q => {
                    let opts = '';
                    if (q.options) {
                        opts = `<div style="margin:8px 0 10px 14px;">${q.options.map(o => `<div>${o}</div>`).join('')}</div>`;
                    }

                    let img = '';
                    if (q.hasImage) {
                        img = `
                            <div class="image-container">
                                <img src="${q.imagePath}" alt="题目图示" class="quiz-image" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                                <div class="image-placeholder-box">
                                    📌 <strong>图片预留位置</strong>：<code>${q.imagePath}</code>
                                </div>
                            </div>
                        `;
                    }

                    let extra = '';
                    if (q.content) extra += `<div style="margin:8px 0;">${q.content}</div>`;

                    let ans = '';
                    if (showAnswers) {
                        ans = `
                            <div style="margin-top:10px; padding:10px 14px; background:var(--ans-box-bg); border-left:3px solid var(--accent-green); border-radius:4px; font-size:0.9rem;">
                                ${q.sol}
                            </div>
                        `;
                    }

                    fullHtml += `
                        <div class="full-q-item">
                            <div><strong>第 ${q.id} 题.</strong> ${q.text}</div>
                            ${img}
                            ${opts}
                            ${extra}
                            ${ans}
                        </div>
                    `;
                });

                fullHtml += `</div>`;
            });

            container.innerHTML = fullHtml;
        }

        function returnSingleMode() {
            document.getElementById('btn-mode-single').classList.add('active');
            document.getElementById('btn-mode-print').classList.remove('active');
            document.getElementById('btn-mode-answers').classList.remove('active');
            renderSingleQuestion();
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }

        document.addEventListener('DOMContentLoaded', () => {
            switchSection('A');
        });
    </script>
</body>
</html>
